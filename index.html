<!doctype html>
<html lang="ca-valencia">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Rànquing i estadístiques de la competició de socis de Gaia Climb d’octubre de 2026.">
  <title>Gaia · Competició</title>
  <link rel="icon" type="image/svg+xml" href="Gaia.svg?v=1">
  <link rel="stylesheet" href="styles.css?v=42">
  <script src="script.js?v=23" defer></script>
</head>
<body>
  <main>
    <header class="capcalera">
      <img class="logo" src="Gaia.svg" alt="Gaia Climb" width="176" height="176">
      <h1>
        <span class="titol-principal">Competició socis</span>
        <span class="titol-secundari">octubre 2026</span>
      </h1>
    </header>

    <noscript>
      <p class="missatge missatge-error">Cal activar JavaScript per a consultar els resultats.</p>
    </noscript>

    <section id="estat-carrega" class="missatge estat-carrega-actiu" aria-live="polite" aria-atomic="true" hidden>
      <span id="indicador-carrega" class="indicador-carrega" aria-hidden="true"></span>
      <p id="text-estat" class="visually-hidden">Carregant resultats…</p>
      <button id="reintentar" class="boto-secundari" type="button" hidden>Torna-ho a provar</button>
    </section>

    <div id="contingut" hidden>
      <p id="sense-resultats" class="missatge" role="status" hidden>
        Encara no hi ha resultats guardats.
      </p>

      <section class="seccio" aria-labelledby="titol-ranquing">
        <h2 id="titol-ranquing">Rànquing</h2>

        <div class="pestanyes" role="tablist" aria-label="Categories del rànquing">
          <button id="pestanya-general" class="pestanya" type="button" role="tab"
            aria-selected="true" aria-controls="panell-ranquing" tabindex="0" data-categoria="General">
            General
          </button>
          <button id="pestanya-femeni" class="pestanya" type="button" role="tab"
            aria-selected="false" aria-controls="panell-ranquing" tabindex="-1" data-categoria="Femení">
            Femení
          </button>
          <button id="pestanya-masculi" class="pestanya" type="button" role="tab"
            aria-selected="false" aria-controls="panell-ranquing" tabindex="-1" data-categoria="Masculí">
            Masculí
          </button>
        </div>

        <div id="panell-ranquing" class="panell-ranquing" role="tabpanel"
          aria-labelledby="pestanya-general" tabindex="0">
          <table>
            <caption class="visually-hidden">Classificació de la categoria General</caption>
            <thead>
              <tr>
                <th scope="col">Posició</th>
                <th scope="col">Nom</th>
                <th scope="col">Punts</th>
              </tr>
            </thead>
            <tbody id="cos-ranquing"></tbody>
          </table>
        </div>

        <nav class="paginacio" aria-label="Paginació del rànquing">
          <button id="ranquing-anterior" class="boto-fletxa" type="button" aria-label="Pàgina anterior del rànquing">‹</button>
          <span id="pagina-ranquing" class="indicador-pagina" aria-live="polite" aria-label="Pàgina 0 de 0">0/0</span>
          <button id="ranquing-seguent" class="boto-fletxa" type="button" aria-label="Pàgina següent del rànquing">›</button>
        </nav>
      </section>

      <section class="seccio" aria-labelledby="titol-estadistiques">
        <h2 id="titol-estadistiques">Estadístiques</h2>

        <dl id="resum-estadistiques" class="resum-estadistiques">
          <div>
            <dt id="etiqueta-participants" class="etiqueta-estadistica">participants</dt>
            <dd id="total-participants">0</dd>
          </div>
          <div>
            <dt id="etiqueta-mitjana" class="etiqueta-estadistica">punts de mitja</dt>
            <dd id="puntuacio-mitjana">0</dd>
          </div>
        </dl>

        <h4 id="titol-grafic" class="titol-grafic">Puntuació per bloc</h4>
        <figure class="figura-grafic" aria-labelledby="titol-grafic" aria-describedby="descripcio-grafic">
          <p id="descripcio-grafic" class="visually-hidden">
            Gràfic de barres apilades amb la quantitat de zones i de tops.
          </p>

          <ul class="llegenda" aria-label="Llegenda del gràfic">
            <li><span class="mostra mostra-top" aria-hidden="true"></span>Top</li>
            <li><span class="mostra mostra-zona" aria-hidden="true"></span>Zona</li>
          </ul>

          <div class="area-grafic">
            <div class="escala" aria-hidden="true">
              <span id="maxim-escala">0</span>
              <span>0</span>
            </div>
            <div id="grafic" class="grafic" role="list" aria-label="Puntuació per bloc"></div>
          </div>
        </figure>

        <nav class="paginacio" aria-label="Paginació del gràfic de puntuació">
          <button id="grafic-anterior" class="boto-fletxa" type="button" aria-label="Pàgina anterior del gràfic de puntuació">‹</button>
          <span id="pagina-grafic" class="indicador-pagina" aria-live="polite" aria-label="Pàgina 1 de 5">1/5</span>
          <button id="grafic-seguent" class="boto-fletxa" type="button" aria-label="Pàgina següent del gràfic de puntuació">›</button>
        </nav>

        <h4 id="titol-grafic-mitjana-intents" class="titol-grafic titol-grafic-intents">Mitja d’intents per bloc</h4>
        <figure class="figura-grafic figura-grafic-intents" aria-labelledby="titol-grafic-mitjana-intents"
          aria-describedby="descripcio-grafic-mitjana-intents estat-mitjana-intents">
          <p id="estat-mitjana-intents" class="nota-grafic" role="status" hidden></p>
          <p id="descripcio-grafic-mitjana-intents" class="visually-hidden">
            Gràfic de barres agrupades amb la mitja d’intents entre els participants de cada resultat.
          </p>

          <ul class="llegenda" aria-label="Llegenda del gràfic de mitja d’intents">
            <li><span class="mostra mostra-intents-top" aria-hidden="true"></span>Top</li>
            <li><span class="mostra mostra-intents-zona" aria-hidden="true"></span>Zona</li>
            <li><span class="mostra mostra-intents-sense" aria-hidden="true"></span>No puntuat</li>
          </ul>

          <div class="area-grafic">
            <div class="escala" aria-hidden="true">
              <span id="maxim-escala-mitjana-intents">0</span>
              <span>0</span>
            </div>
            <div id="grafic-mitjana-intents" class="grafic" role="list" aria-label="Mitja d’intents per bloc"></div>
          </div>
        </figure>

        <nav class="paginacio" aria-label="Paginació del gràfic de mitja d’intents">
          <button id="grafic-mitjana-intents-anterior" class="boto-fletxa" type="button" aria-label="Pàgina anterior del gràfic de mitja d’intents">‹</button>
          <span id="pagina-grafic-mitjana-intents" class="indicador-pagina" aria-live="polite" aria-label="Pàgina 1 de 5">1/5</span>
          <button id="grafic-mitjana-intents-seguent" class="boto-fletxa" type="button" aria-label="Pàgina següent del gràfic de mitja d’intents">›</button>
        </nav>

        <h4 id="titol-grafic-intents" class="titol-grafic titol-grafic-intents">Intents per bloc</h4>
        <figure class="figura-grafic figura-grafic-intents" aria-labelledby="titol-grafic-intents"
          aria-describedby="descripcio-grafic-intents estat-intents">
          <p id="estat-intents" class="nota-grafic" role="status" hidden></p>
          <p id="descripcio-grafic-intents" class="visually-hidden">
            Gràfic de barres apilades amb la suma d’intents segons el resultat final de cada participant.
          </p>

          <ul class="llegenda" aria-label="Llegenda del gràfic d’intents">
            <li><span class="mostra mostra-intents-top" aria-hidden="true"></span>Top</li>
            <li><span class="mostra mostra-intents-zona" aria-hidden="true"></span>Zona</li>
            <li><span class="mostra mostra-intents-sense" aria-hidden="true"></span>No puntuat</li>
          </ul>

          <div class="area-grafic">
            <div class="escala" aria-hidden="true">
              <span id="maxim-escala-intents">0</span>
              <span>0</span>
            </div>
            <div id="grafic-intents" class="grafic" role="list" aria-label="Intents per bloc"></div>
          </div>
        </figure>

        <nav class="paginacio" aria-label="Paginació del gràfic d’intents">
          <button id="grafic-intents-anterior" class="boto-fletxa" type="button" aria-label="Pàgina anterior del gràfic d’intents">‹</button>
          <span id="pagina-grafic-intents" class="indicador-pagina" aria-live="polite" aria-label="Pàgina 1 de 5">1/5</span>
          <button id="grafic-intents-seguent" class="boto-fletxa" type="button" aria-label="Pàgina següent del gràfic d’intents">›</button>
        </nav>

      </section>
    </div>

    <p id="anunci-canvis" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
</body>
</html>
